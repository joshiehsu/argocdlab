apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
  namespace: default
spec:
  replicas: 6
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
      - name: web
        image: ghcr.io/joshiehsu/argocd-lab-web:27bb81591d2f270f53537af3471f58f00c6d535b
        ports:
        - containerPort: 80
