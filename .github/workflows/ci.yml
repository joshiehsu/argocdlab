name: 自動打包與更新 ArgoCD 部署檔

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 下載專案程式碼
        uses: actions/checkout@v4

      - name: 🔑 登入 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: 📦 建置並推送 Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/argocd-lab-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/argocd-lab-web:latest
