name: 自動打包與更新 ArgoCD 部署檔

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 下載專案程式碼
        uses: actions/checkout@v4

      - name: 🔑 登入 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: 📦 建置並推送 Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/argocd-lab-web:${{ github.sha }}

      - name: 📝 更新 Kubernetes YAML 檔裡面的 Image 標籤
        run: |
          sed -i "s|image: .*|image: ghcr.io/${{ github.repository_owner }}/argocd-lab-web:${{ github.sha }}|g" guestbook/deployment.yaml

      - name: 🚀 自動 Commit 並 Push 變更
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update image tag to ${{ github.sha }}"
          file_pattern: "guestbook/deployment.yaml"
