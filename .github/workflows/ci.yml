name: 自動打包與更新 ArgoCD 部署檔

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      packages: write

    steps:
      - name: 📥 下載專案程式碼
        uses: actions/checkout@v4

      - name: 🔑 登入 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: 📦 建置並推送 Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/argocd-lab-web:${{ github.sha }}

      - name: 📝 精準更新 Helm YAML 裡 v2 的 Image Tag
        run: |
          # 這裡使用 python 來安全地修改 yaml，避免 sed 抓錯行
          python3 -c "
          import yaml
          path = 'guestbook-helm/values.yaml'
          with open(path, 'r') as f:
              data = yaml.safe_load(f)
          
          # 尋找 routes 裡面 version 為 v2 的項目並更新 imageTag
          for route in data.get('trafficSplit', {}).get('routes', []):
              if route.get('version') == 'v2':
                  route['imageTag'] = '${{ github.sha }}'
          
          with open(path, 'w') as f:
              yaml.safe_dump(data, f, sort_keys=False)
          "

      - name: 🚀 自動 Commit 並 Push 變更
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update v2 image tag to ${{ github.sha }}"
          file_pattern: "guestbook-helm/values.yaml"
